<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>飞机大战</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
}
canvas {
    display: block;
    margin: 0 auto;
    background: #000;
    touch-action: none;
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
(function(){
'use strict';

// ========== Canvas Setup ==========
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ========== Audio ==========
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch(e) {}
    }
}

function playShoot() {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.05);
    } catch(e) {}
}

function playExplosion() {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.3);
    } catch(e) {}
}

function playPlayerHit() {
    if (!audioCtx) return;
    try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.2);
    } catch(e) {}
}

// ========== Game State ==========
const GameState = { MENU: 0, PLAYING: 1, GAMEOVER: 2 };

let state = GameState.MENU;
let score = 0;
let lives = 3;
let gameTime = 0;
let difficulty = 1;
let spawnTimer = 0;
let spawnInterval = 60; // frames

// ========== Stars ==========
const stars = [];
for (let i = 0; i < 120; i++) {
    stars.push({
        x: Math.random() * 2000 - 1000,
        y: Math.random() * 2000 - 1000,
        z: Math.random() * 1000,
        size: Math.random() * 2 + 0.5
    });
}

// ========== Player ==========
const player = {
    x: 0, y: 0,
    w: 40, h: 48,
    speed: 5,
    shootCooldown: 0,
    shootDelay: 10,
    invincible: 0,
    engineFlicker: 0
};

// ========== Bullets ==========
const bullets = [];
const BULLET_SPEED = -8;
const BULLET_W = 4;
const BULLET_H = 12;

// ========== Enemies ==========
const enemies = [];
const ENEMY_TYPES = [
    { w: 30, h: 30, hp: 1, speed: 2, score: 10, color: '#ff6b6b' },
    { w: 36, h: 36, hp: 2, speed: 1.5, score: 20, color: '#ffa94d' },
    { w: 44, h: 44, hp: 3, speed: 1.2, score: 30, color: '#ff6bff' }
];

// ========== Particles ==========
const particles = [];

// ========== Input ==========
const keys = { left: false, right: false, up: false, down: false, space: false };
let touchActive = false;
let touchX = 0, touchY = 0;

// Keyboard
document.addEventListener('keydown', function(e) {
    if (state === GameState.MENU || state === GameState.GAMEOVER) {
        if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            initAudio();
            startGame();
            return;
        }
    }
    switch(e.key) {
        case 'ArrowLeft': case 'a': case 'A': keys.left = true; e.preventDefault(); break;
        case 'ArrowRight': case 'd': case 'D': keys.right = true; e.preventDefault(); break;
        case 'ArrowUp': case 'w': case 'W': keys.up = true; e.preventDefault(); break;
        case 'ArrowDown': case 's': case 'S': keys.down = true; e.preventDefault(); break;
        case ' ': keys.space = true; e.preventDefault(); break;
    }
});
document.addEventListener('keyup', function(e) {
    switch(e.key) {
        case 'ArrowLeft': case 'a': case 'A': keys.left = false; break;
        case 'ArrowRight': case 'd': case 'D': keys.right = false; break;
        case 'ArrowUp': case 'w': case 'W': keys.up = false; break;
        case 'ArrowDown': case 's': case 'S': keys.down = false; break;
        case ' ': keys.space = false; break;
    }
});

// Touch
canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    initAudio();
    if (state === GameState.MENU || state === GameState.GAMEOVER) {
        startGame();
        return;
    }
    const t = e.touches[0];
    touchActive = true;
    touchX = t.clientX;
    touchY = t.clientY;
    keys.space = true;
}, { passive: false });

canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (state !== GameState.PLAYING) return;
    const t = e.touches[0];
    touchX = t.clientX;
    touchY = t.clientY;
}, { passive: false });

canvas.addEventListener('touchend', function(e) {
    e.preventDefault();
    touchActive = false;
    keys.space = false;
}, { passive: false });

canvas.addEventListener('touchcancel', function(e) {
    e.preventDefault();
    touchActive = false;
    keys.space = false;
}, { passive: false });

// Mouse click for menu/gameover
canvas.addEventListener('click', function() {
    initAudio();
    if (state === GameState.MENU || state === GameState.GAMEOVER) {
        startGame();
    }
});

// ========== Game Functions ==========
function startGame() {
    state = GameState.PLAYING;
    score = 0;
    lives = 3;
    gameTime = 0;
    difficulty = 1;
    spawnTimer = 0;
    spawnInterval = 60;
    enemies.length = 0;
    bullets.length = 0;
    particles.length = 0;
    player.x = W / 2;
    player.y = H - 100;
    player.invincible = 0;
    player.shootCooldown = 0;
    player.engineFlicker = 0;
}

function spawnEnemy() {
    const maxType = Math.min(ENEMY_TYPES.length - 1, Math.floor(difficulty / 2));
    const typeIdx = Math.floor(Math.random() * (maxType + 1));
    const type = ENEMY_TYPES[typeIdx];
    enemies.push({
        x: Math.random() * (W - type.w) + type.w / 2,
        y: -type.h,
        w: type.w, h: type.h,
        hp: type.hp,
        speed: type.speed + (difficulty * 0.1),
        score: type.score,
        color: type.color,
        type: typeIdx
    });
}

function spawnExplosion(x, y, color, count) {
    count = count || 25;
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1;
        particles.push({
            x: x, y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            decay: Math.random() * 0.02 + 0.01,
            size: Math.random() * 4 + 2,
            color: color || '#ff6b6b'
        });
    }
}

function spawnPlayerExplosion() {
    const colors = ['#ff6b6b', '#ffa94d', '#ffd43b', '#fff'];
    for (let i = 0; i < 50; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        particles.push({
            x: player.x, y: player.y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            decay: Math.random() * 0.015 + 0.008,
            size: Math.random() * 5 + 2,
            color: colors[Math.floor(Math.random() * colors.length)]
        });
    }
}

// ========== Update ==========
function update() {
    if (state !== GameState.PLAYING) return;

    gameTime++;
    difficulty = 1 + gameTime / 1800; // increases every ~30s
    spawnInterval = Math.max(15, 60 - difficulty * 3);

    // Spawn enemies
    spawnTimer++;
    if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        spawnEnemy();
        // Sometimes spawn extra
        if (Math.random() < difficulty * 0.05) {
            spawnEnemy();
        }
    }

    // Player movement
    let dx = 0, dy = 0;
    if (keys.left) dx -= 1;
    if (keys.right) dx += 1;
    if (keys.up) dy -= 1;
    if (keys.down) dy += 1;

    // Touch control
    if (touchActive) {
        const targetX = touchX;
        const targetY = touchY;
        const diffX = targetX - player.x;
        const diffY = targetY - player.y;
        const dist = Math.sqrt(diffX * diffX + diffY * diffY);
        if (dist > 5) {
            const moveSpeed = Math.min(player.speed * 1.2, dist * 0.15);
            dx = diffX / dist;
            dy = diffY / dist;
            player.x += dx * moveSpeed;
            player.y += dy * moveSpeed;
        }
    } else {
        if (dx || dy) {
            const len = Math.sqrt(dx * dx + dy * dy);
            dx /= len;
            dy /= len;
            player.x += dx * player.speed;
            player.y += dy * player.speed;
        }
    }

    // Clamp player
    player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));
    player.y = Math.max(player.h / 2, Math.min(H - player.h / 2, player.y));

    // Invincibility
    if (player.invincible > 0) player.invincible--;

    // Engine flicker
    player.engineFlicker = (player.engineFlicker + 1) % 6;

    // Auto-shoot (always on, or space)
    if (player.shootCooldown > 0) player.shootCooldown--;
    const shouldShoot = keys.space || touchActive;
    if (shouldShoot && player.shootCooldown <= 0) {
        player.shootCooldown = player.shootDelay;
        bullets.push({
            x: player.x - 4, y: player.y - player.h / 2,
            w: BULLET_W, h: BULLET_H,
            speed: BULLET_SPEED
        });
        bullets.push({
            x: player.x + 4, y: player.y - player.h / 2,
            w: BULLET_W, h: BULLET_H,
            speed: BULLET_SPEED
        });
        playShoot();
    }

    // Update bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y += b.speed;
        if (b.y + b.h < 0 || b.y > H) {
            bullets.splice(i, 1);
        }
    }

    // Update enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += e.speed;
        if (e.y > H + 50) {
            enemies.splice(i, 1);
        }
    }

    // Collision: bullets vs enemies
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        let bulletUsed = false;
        for (let j = enemies.length - 1; j >= 0; j--) {
            const e = enemies[j];
            if (Math.abs(b.x - e.x) < (b.w + e.w) / 2 &&
                Math.abs(b.y - e.y) < (b.h + e.h) / 2) {
                e.hp--;
                bulletUsed = true;
                if (e.hp <= 0) {
                    score += e.score;
                    spawnExplosion(e.x, e.y, e.color, 20);
                    playExplosion();
                    enemies.splice(j, 1);
                }
                break;
            }
        }
        if (bulletUsed) {
            bullets.splice(i, 1);
        }
    }

    // Collision: player vs enemies
    if (player.invincible <= 0) {
        for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            if (Math.abs(player.x - e.x) < (player.w + e.w) / 2 - 5 &&
                Math.abs(player.y - e.y) < (player.h + e.h) / 2 - 5) {
                // Player hit
                lives--;
                player.invincible = 90; // 1.5s invincibility
                spawnPlayerExplosion();
                playPlayerHit();
                enemies.splice(i, 1);
                if (lives <= 0) {
                    state = GameState.GAMEOVER;
                    spawnPlayerExplosion();
                    playExplosion();
                }
                break;
            }
        }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05; // gravity
        p.life -= p.decay;
        if (p.life <= 0) {
            particles.splice(i, 1);
        }
    }
}

// ========== Draw ==========
function draw() {
    ctx.clearRect(0, 0, W, H);

    // === Starfield ===
    const cx = (state === GameState.PLAYING || state === GameState.GAMEOVER) ? player.x : W / 2;
    const cy = (state === GameState.PLAYING || state === GameState.GAMEOVER) ? player.y : H / 2;
    const time = Date.now() * 0.0001;

    for (const star of stars) {
        const scale = 600 / star.z;
        const sx = (star.x - cx * 0.3) * scale + W / 2;
        const sy = (star.y - cy * 0.3) * scale + H / 2;
        const sz = star.size * scale;
        if (sx < -10 || sx > W + 10 || sy < -10 || sy > H + 10) continue;
        const alpha = Math.min(1, (1 - star.z / 1000) * 0.8);
        const twinkle = 0.6 + 0.4 * Math.sin(time * 5 + star.z);
        ctx.fillStyle = 'rgba(255,255,255,' + (alpha * twinkle) + ')';
        ctx.beginPath();
        ctx.arc(sx, sy, Math.max(0.5, sz), 0, Math.PI * 2);
        ctx.fill();
    }

    if (state === GameState.MENU) {
        drawMenu();
    } else if (state === GameState.PLAYING || state === GameState.GAMEOVER) {
        drawGame();
    }
}

function drawMenu() {
    // Title
    const title = '飞机大战';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Glow effect
    ctx.shadowColor = '#00aaff';
    ctx.shadowBlur = 30;
    ctx.font = 'bold 56px "Microsoft YaHei", "PingFang SC", sans-serif';
    ctx.fillStyle = '#00ccff';
    ctx.fillText(title, W / 2, H * 0.3);

    ctx.shadowBlur = 0;

    // Subtitle
    ctx.font = '20px "Microsoft YaHei", "PingFang SC", sans-serif';
    ctx.fillStyle = '#88ccff';
    ctx.fillText('键盘方向键 / WASD 移动 · 自动射击', W / 2, H * 0.45);

    // Start prompt
    const pulse = 0.6 + 0.4 * Math.sin(Date.now() * 0.004);
    ctx.globalAlpha = pulse;
    ctx.font = '24px "Microsoft YaHei", "PingFang SC", sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('点击或按空格键开始', W / 2, H * 0.6);
    ctx.globalAlpha = 1;

    // Controls hint
    ctx.font = '14px "Microsoft YaHei", "PingFang SC", sans-serif';
    ctx.fillStyle = '#6688aa';
    ctx.fillText('手机触屏拖动控制飞机', W / 2, H * 0.7);
}

function drawGame() {
    // === Draw particles ===
    for (const p of particles) {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;

    // === Draw player ===
    if (state === GameState.PLAYING && player.invincible > 0 && Math.floor(player.invincible / 6) % 2 === 0) {
        // Blink when invincible
    } else if (state === GameState.PLAYING) {
        drawPlayer();
    }

    // === Draw enemies ===
    for (const e of enemies) {
        drawEnemy(e);
    }

    // === Draw bullets ===
    for (const b of bullets) {
        const grad = ctx.createLinearGradient(b.x, b.y - b.h / 2, b.x, b.y + b.h / 2);
        grad.addColorStop(0, '#00ffff');
        grad.addColorStop(0.5, '#ffffff');
        grad.addColorStop(1, '#00ffff');
        ctx.fillStyle = grad;
        ctx.shadowColor = '#00ffff';
        ctx.shadowBlur = 12;
        ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    }
    ctx.shadowBlur = 0;

    // === HUD ===
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.font = 'bold 18px "Microsoft YaHei", "PingFang SC", sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 4;
    ctx.fillText('得分: ' + score, 15, 15);

    // Lives as hearts
    ctx.textAlign = 'right';
    let livesText = '';
    for (let i = 0; i < lives; i++) livesText += '❤ ';
    ctx.fillText(livesText, W - 15, 15);
    ctx.shadowBlur = 0;

    // Difficulty indicator
    ctx.textAlign = 'right';
    ctx.font = '14px "Microsoft YaHei", "PingFang SC", sans-serif';
    ctx.fillStyle = '#aaaacc';
    ctx.fillText('难度 Lv.' + difficulty.toFixed(1), W - 15, 42);

    // === Game Over overlay ===
    if (state === GameState.GAMEOVER) {
        drawGameOver();
    }
}

function drawPlayer() {
    const px = player.x;
    const py = player.y;
    const pw = player.w;
    const ph = player.h;

    // Engine glow
    const flicker = 0.8 + 0.2 * Math.sin(Date.now() * 0.02 + player.engineFlicker);
    const engineLen = 16 * flicker;

    // Engine flame
    const grad = ctx.createRadialGradient(px, py + ph / 2 + engineLen * 0.3, 2, px, py + ph / 2 + engineLen * 0.3, engineLen);
    grad.addColorStop(0, 'rgba(255,200,50,0.9)');
    grad.addColorStop(0.4, 'rgba(255,100,0,0.6)');
    grad.addColorStop(1, 'rgba(255,50,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(px - 8, py + ph / 2);
    ctx.quadraticCurveTo(px - 12, py + ph / 2 + engineLen, px, py + ph / 2 + engineLen + 6 * flicker);
    ctx.quadraticCurveTo(px + 12, py + ph / 2 + engineLen, px + 8, py + ph / 2);
    ctx.closePath();
    ctx.fill();

    // Side flames
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(px - pw / 2 + 4, py + ph / 2 - 4);
    ctx.quadraticCurveTo(px - pw / 2 - 2, py + ph / 2 + engineLen * 0.5, px - pw / 2 + 8, py + ph / 2 - 2);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(px + pw / 2 - 4, py + ph / 2 - 4);
    ctx.quadraticCurveTo(px + pw / 2 + 2, py + ph / 2 + engineLen * 0.5, px + pw / 2 - 8, py + ph / 2 - 2);
    ctx.closePath();
    ctx.fill();

    // Body - main fuselage
    ctx.shadowColor = '#00aaff';
    ctx.shadowBlur = 15;

    const bodyGrad = ctx.createLinearGradient(px, py - ph / 2, px, py + ph / 2);
    bodyGrad.addColorStop(0, '#4dc9f6');
    bodyGrad.addColorStop(0.3, '#2a9df4');
    bodyGrad.addColorStop(0.7, '#1a7ac4');
    bodyGrad.addColorStop(1, '#0f5a94');
    ctx.fillStyle = bodyGrad;

    ctx.beginPath();
    // Nose
    ctx.moveTo(px, py - ph / 2);
    // Right side
    ctx.quadraticCurveTo(px + pw / 2 + 4, py - ph / 4, px + pw / 2, py + ph / 4);
    // Right wing tip
    ctx.lineTo(px + pw / 2 + 12, py + ph / 4 + 4);
    ctx.lineTo(px + pw / 2 + 6, py + ph / 2 - 4);
    // Bottom right
    ctx.quadraticCurveTo(px + 4, py + ph / 2, px, py + ph / 2);
    // Bottom left
    ctx.quadraticCurveTo(px - 4, py + ph / 2, px - pw / 2 - 6, py + ph / 2 - 4);
    // Left wing tip
    ctx.lineTo(px - pw / 2 - 12, py + ph / 4 + 4);
    ctx.lineTo(px - pw / 2, py + ph / 4);
    // Left side
    ctx.quadraticCurveTo(px - pw / 2 - 4, py - ph / 4, px, py - ph / 2);
    ctx.closePath();
    ctx.fill();

    // Cockpit
    ctx.shadowBlur = 8;
    ctx.shadowColor = '#66ddff';
    const cockpitGrad = ctx.createRadialGradient(px - 2, py - ph / 6, 1, px, py - ph / 6, 8);
    cockpitGrad.addColorStop(0, '#aaffff');
    cockpitGrad.addColorStop(0.5, '#44ddff');
    cockpitGrad.addColorStop(1, '#0088cc');
    ctx.fillStyle = cockpitGrad;
    ctx.beginPath();
    ctx.ellipse(px, py - ph / 6, 7, 9, 0, 0, Math.PI * 2);
    ctx.fill();

    // Body highlight
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(px - 4, py - ph / 2 + 6);
    ctx.quadraticCurveTo(px - pw / 4, py - ph / 8, px - pw / 4 - 4, py + ph / 4);
    ctx.stroke();

    ctx.shadowBlur = 0;
}

function drawEnemy(e) {
    const ex = e.x, ey = e.y;
    const ew = e.w, eh = e.h;

    // Glow
    ctx.shadowColor = e.color;
    ctx.shadowBlur = 8;

    // Body
    const grad = ctx.createRadialGradient(ex, ey, 2, ex, ey, ew / 2);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.3, e.color);
    grad.addColorStop(1, '#880000');
    ctx.fillStyle = grad;

    ctx.beginPath();
    // Top
    ctx.moveTo(ex, ey - eh / 2);
    // Right
    ctx.quadraticCurveTo(ex + ew / 2 + 2, ey - eh / 4, ex + ew / 2, ey);
    // Bottom
    ctx.quadraticCurveTo(ex + ew / 2 + 2, ey + eh / 4, ex + ew / 4, ey + eh / 2);
    ctx.lineTo(ex - ew / 4, ey + eh / 2);
    // Left
    ctx.quadraticCurveTo(ex - ew / 2 - 2, ey + eh / 4, ex - ew / 2, ey);
    // Top left
    ctx.quadraticCurveTo(ex - ew / 2 - 2, ey - eh / 4, ex, ey - eh / 2);
    ctx.closePath();
    ctx.fill();

    // Enemy cockpit
    ctx.shadowBlur = 4;
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.ellipse(ex, ey - 2, ew * 0.2, eh * 0.25, 0, 0, Math.PI * 2);
    ctx.fill();

    // HP indicator for tougher enemies
    if (e.hp > 1) {
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(e.hp, ex, ey + 2);
    }

    ctx.shadowBlur = 0;
}

function drawGameOver() {
    // Overlay
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Game Over title
    ctx.shadowColor = '#ff3333';
    ctx.shadowBlur = 30;
    ctx.font = 'bold 52px "Microsoft YaHei", "PingFang SC", sans-serif';
    ctx.fillStyle = '#ff4444';
    ctx.fillText('游戏结束', W / 2, H * 0.3);
    ctx.shadowBlur = 0;

    // Score
    ctx.font = '24px "Microsoft YaHei", "PingFang SC", sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('最终得分: ' + score, W / 2, H * 0.42);

    // Restart button
    const btnW = 200, btnH = 54;
    const btnX = W / 2 - btnW / 2, btnY = H * 0.55 - btnH / 2;

    const pulse = 0.9 + 0.1 * Math.sin(Date.now() * 0.005);
    ctx.shadowColor = '#00aaff';
    ctx.shadowBlur = 20 * pulse;

    const btnGrad = ctx.createLinearGradient(btnX, btnY, btnX, btnY + btnH);
    btnGrad.addColorStop(0, '#2a9df4');
    btnGrad.addColorStop(0.5, '#1a7ac4');
    btnGrad.addColorStop(1, '#0f5a94');
    ctx.fillStyle = btnGrad;

    // Rounded rect
    const r = 12;
    ctx.beginPath();
    ctx.moveTo(btnX + r, btnY);
    ctx.lineTo(btnX + btnW - r, btnY);
    ctx.quadraticCurveTo(btnX + btnW, btnY, btnX + btnW, btnY + r);
    ctx.lineTo(btnX + btnW, btnY + btnH - r);
    ctx.quadraticCurveTo(btnX + btnW, btnY + btnH, btnX + btnW - r, btnY + btnH);
    ctx.lineTo(btnX + r, btnY + btnH);
    ctx.quadraticCurveTo(btnX, btnY + btnH, btnX, btnY + btnH - r);
    ctx.lineTo(btnX, btnY + r);
    ctx.quadraticCurveTo(btnX, btnY, btnX + r, btnY);
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.font = 'bold 20px "Microsoft YaHei", "PingFang SC", sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText('重新开始', W / 2, H * 0.55);
}

// ========== Game Loop ==========
function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

// ========== Init ==========
player.x = W / 2;
player.y = H - 100;
gameLoop();

// Handle resize for player position
window.addEventListener('resize', function() {
    if (player.x > W) player.x = W / 2;
    if (player.y > H) player.y = H - 100;
});

})();
</script>
