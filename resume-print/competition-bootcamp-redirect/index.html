<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>正在前往新的个人主页 · 杨豫豪</title>

<!-- 旧地址跳转页：访问 /competition-bootcamp/ 自动前往新主页 -->
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="refresh" content="0; url=https://yanghao158640.github.io/">
<link rel="canonical" href="https://yanghao158640.github.io/">

<style>
  :root {
    --ink: #1c1e1b;
    --ink-sub: #4a4f49;
    --muted: #8b918a;
    --accent: #0f6e56;
    --hair: #e2e5e0;
    --bg: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 420px;
    padding: 36px 32px 32px;
    border: 1px solid var(--hair);
    border-radius: 14px;
    text-align: center;
  }

  .mark {
    width: 44px;
    height: 44px;
    margin: 0 auto 20px;
    display: block;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 0.01em;
  }

  p {
    margin: 0;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--ink-sub);
  }

  .hint {
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--muted);
  }

  .go {
    display: inline-block;
    margin-top: 22px;
    padding: 10px 22px;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 13.5px;
    font-weight: 600;
    text-decoration: none;
    transition: opacity 0.15s ease;
  }

  .go:hover { opacity: 0.88; }

  .bar {
    margin-top: 24px;
    height: 2px;
    border-radius: 2px;
    background: var(--hair);
    overflow: hidden;
  }

  .bar i {
    display: block;
    height: 100%;
    width: 40%;
    background: var(--accent);
    animation: slide 1.1s ease-in-out infinite;
  }

  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  @media (prefers-reduced-motion: reduce) {
    .bar i { animation: none; width: 100%; }
  }
</style>
</head>
<body>
  <main class="card">
    <svg class="mark" viewBox="0 0 44 44" fill="none" aria-hidden="true">
      <circle cx="22" cy="22" r="20.5" stroke="#e2e5e0" stroke-width="1.5"/>
      <path d="M15 22.5h11.5" stroke="#0f6e56" stroke-width="2" stroke-linecap="round"/>
      <path d="M22 16.5l6 6-6 6" stroke="#0f6e56" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <h1>页面已迁移</h1>
    <p>旧的简历页面已下线，正在前往新的个人主页。</p>
    <p class="hint">若 3 秒内没有自动跳转，请点下面的按钮。</p>

    <a class="go" href="https://yanghao158640.github.io/">前往个人主页 →</a>

    <div class="bar"><i></i></div>
  </main>

  <script>
    // 立即替换当前历史记录，避免用户按「返回」又回到旧地址
    location.replace("https://yanghao158640.github.io/");
  </script>
</body>
</html>
